<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GourmetPOS | Administración</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="main-wrapper" style="margin-left:0"><header class="header"><div class="header-title">Administración GourmetPOS</div></header><main class="content"><section id="login" class="card" style="max-width:430px;margin:48px auto"><div class="card-title">Acceso privado</div><div class="form-group"><label>Correo</label><input id="email" type="email" autocomplete="username"></div><div class="form-group"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn btn-primary btn-full" onclick="signIn()">Ingresar</button></section><section id="panel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2>Clientes y pagos</h2><button class="btn btn-ghost btn-sm" onclick="signOut()">Cerrar sesión</button></div><div class="card"><div class="card-title">Solicitudes de suscripción</div><div class="table-wrapper"><table><thead><tr><th>Fecha</th><th>Negocio</th><th>Plan</th><th>Contacto</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><script src="assets/js/api.js"></script><script>let token=sessionStorage.getItem('admin_token');function badgeEstado(estado){const map={pendiente:'<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#f59e0b22;color:#fbbf24;font-size:12px">Pendiente</span>',reportado:'<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#3b82f622;color:#93c5fd;font-size:12px">Reportado</span>',aprobado:'<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#22c55e22;color:#4ade80;font-size:12px">Aprobado</span>'};return map[estado]||'<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#64748b22;color:#cbd5e1;font-size:12px">'+(estado||'Sin estado')+'</span>'}async function api(path,opt={}){const r=await fetch('/api/admin'+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opt.headers}});if(!r.ok)throw new Error((await r.json()).detail||'Error');return r.json()}async function signIn(){try{const r=await api('/login',{method:'POST',headers:{'Content-Type':'application/json','Authorization':''},body:JSON.stringify({email:email.value,password:password.value})});token=r.token;sessionStorage.setItem('admin_token',token);showPanel()}catch(e){toast(e.message,'error')}}function signOut(){sessionStorage.removeItem('admin_token');location.reload()}async function showPanel(){login.style.display='none';panel.style.display='block';try{const data=await api('/solicitudes');rows.innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('es-CO')}</td><td><b>${x.negocio}</b><br><small>NIT ${x.nit}</small></td><td>${x.plan}<br>${fmt(x.valor)}</td><td>${x.responsable}<br><small>${x.email}<br>${x.telefono}</small></td><td><b>${x.metodo_pago}</b><br><small>${x.referencia_pago||'Sin referencia'}</small></td><td>${badgeEstado(x.estado)}<br><small>${x.email}</small></td><td>${x.estado==='aprobado'?'✓':'<button class="btn btn-primary btn-sm" onclick="approve('+x.id+')">Aprobar</button>'}</td></tr>`).join('')||'<tr><td colspan="7">No hay solicitudes todavía.</td></tr>'}catch(e){signOut()}}async function approve(id){try{await api('/solicitudes/'+id+'/aprobar',{method:'PUT'});showPanel();toast('Pago aprobado','success')}catch(e){toast(e.message,'error')}}if(token)showPanel()</script></body></html>
